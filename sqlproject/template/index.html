<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 50px 20px;
        }

        h2 {
            text-align: center;
            color: white;
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        table {
            width: 85%;
            margin: auto;
            border-collapse: separate;
            border-spacing: 0;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        th {
            background-color: #22223b;
            color: white;
            padding: 16px;
            font-size: 16px;
        }

        td {
            padding: 14px;
            text-align: center;
            color: #333;
            border-bottom: 1px solid #ddd;
        }

        tbody tr {
            transition: 0.3s;
        }

        tbody tr:hover {
            background-color: #f0f3ff;
            transform: scale(1.01);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            table {
                width: 100%;
                font-size: 14px;
            }

            th, td {
                padding: 10px 5px;
            }

            h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <h2>Student Details</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Place</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
            {% for i in stud %}
            <tr>
                <td>{{ i.name }}</td>
                <td>{{ i.age }}</td>
                <td>{{ i.place }}</td>
                <td>{{ i.email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
