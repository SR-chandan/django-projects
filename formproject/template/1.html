<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <style>
        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
            <th>Email</th>
            <th>Date of Birth</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.Name }}</td>
            <td>{{ i.Age }}</td>
            <td>{{ i.Place }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.dob }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
