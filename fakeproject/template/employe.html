<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body>

    <h1>Employee Details</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>Email</th>
            <th>Salary</th>
            <th>Place</th>
        </tr>

        {% for i in emp %}
        <tr>
            <td>{{ i.Employee_ID }}</td>
            <td>{{ i.Name }}</td>
            <td>{{ i.Age }}</td>
            <td>{{ i.Department }}</td>
            <td>{{ i.Email }}</td>
            <td>{{ i.Salary }}</td>
            <td>{{ i.Place }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
